<!-- BOTONES DE CAPTURA: ticket, voz y cámara (cada uno abre su modal) -->
<div id="qrScannerComponent">

  <div class="d-flex gap-2 mb-2">

    <!-- Escanear el QR del ticket (modal en _parking_qr_ticket_modal.html) -->
    <button
      type="button"
      id="qrTicketOpenBtn"
      class="btn btn-outline-light w-50 rounded-pill d-flex align-items-center justify-content-center gap-2"
      onclick="QrScanner.open()"
    >
      <i class="bi bi-qr-code-scan"></i>
      Escanear ticket
    </button>

    <!-- Dictado de placa por voz (modal en _parking_voice_plate_modal.html) -->
    <button
      type="button"
      id="voicePlateOpenBtn"
      class="btn btn-outline-light w-50 rounded-pill d-flex align-items-center justify-content-center gap-2"
      onclick="VoicePlate.open()"
    >
      <i class="bi bi-mic-fill"></i>
      Dictar placa
    </button>

  </div>

  {% if plate_scan %}
  <!-- Escaneo de placa con cámara e IA (modal en _parking_plate_camera_modal.html) -->
    {% if plate_scan.exhausted %}
    <button
      type="button"
      id="plateCameraOpenBtn"
      class="btn btn-outline-secondary w-100 rounded-pill d-flex align-items-center justify-content-center gap-2 mb-2"
      disabled
    >
      <i class="bi bi-camera-fill"></i>
      Paquete de IA agotado
    </button>
    {% else %}
    <button
      type="button"
      id="plateCameraOpenBtn"
      class="btn btn-outline-info w-100 rounded-pill d-flex align-items-center justify-content-center gap-2 mb-2"
      onclick="PlateCamera.open()"
    >
      <i class="bi bi-camera-fill"></i>
      Escanear placa
    </button>
    {% endif %}
  {% endif %}

</div>
