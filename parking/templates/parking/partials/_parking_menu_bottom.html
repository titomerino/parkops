<!-- Bottom Navigation -->
<nav class="position-fixed bottom-0 start-0 w-100 z-3">
    <div class="bg-dark border-top border-secondary shadow-lg">

        <div class="d-flex justify-content-around align-items-center text-center py-2">

            <!-- Inicio -->
            <a href="{% url 'dashboard' %}" class="text-decoration-none">
                <div class="d-flex flex-column align-items-center px-3">
                    <i class="bi bi-house-door fs-4
                        {% if request.resolver_match.url_name == 'dashboard' %}
                            text-success
                        {% else %}
                            text-light
                        {% endif %}">
                    </i>
                    <small class="text-light">Inicio</small>
                </div>
            </a>

            <!-- Separador -->
            <div class="vr text-secondary opacity-50" style="height:32px;"></div>

            <!-- Escáner -->
            <a href="{% url 'search_plate' %}" class="text-decoration-none">
                <div class="d-flex flex-column align-items-center px-3">
                    <i class="bi bi-search fs-4
                        {% if request.resolver_match.url_name == 'search_plate' %}
                            text-success
                        {% else %}
                            text-light
                        {% endif %}">
                    </i>
                    <small class="text-light">Placa</small>
                </div>
            </a>

            <!-- Separador -->
            <div class="vr text-secondary opacity-50" style="height:32px;"></div>

            {% if current_parking.keys_enabled and perms.parking.view_entry %}
            <!-- Llaves en custodia -->
            <a href="{% url 'keys_list' %}" class="text-decoration-none">
                <div class="d-flex flex-column align-items-center px-3 position-relative">
                    <i class="bi bi-key fs-4
                        {% if request.resolver_match.url_name == 'keys_list' %}
                            text-success
                        {% else %}
                            text-light
                        {% endif %}">
                    </i>
                    <small class="text-light">Llaves</small>
                    {% with total=keys_in_custody %}
                    {% if total %}
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-warning text-dark">
                        {{ total }}
                    </span>
                    {% endif %}
                    {% endwith %}
                </div>
            </a>

            <!-- Separador -->
            <div class="vr text-secondary opacity-50" style="height:32px;"></div>
            {% endif %}

            <!-- Historial -->
            <a href="{% url 'record' %}" class="text-decoration-none">
                <div class="d-flex flex-column align-items-center px-3">
                    <i class="bi bi-clock-history fs-4
                        {% if request.resolver_match.url_name == 'record' %}
                            text-success
                        {% else %}
                            text-light
                        {% endif %}">
                    </i>
                    <small class="text-light">Historial</small>
                </div>
            </a>

        </div>
    </div>
</nav>
