<!-- BOTONES DE CAPTURA: cámara, voz y ticket (cada uno abre su modal) -->
<style>
  .capture-tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .25rem;
    width: 100%;
    height: 100%;
    padding: .75rem .25rem;
    border: 1px solid transparent;
    border-radius: 1rem;
    background: #1b212b;
    color: #cbd3dd;
    font-size: .8rem;
    line-height: 1.2;
    transition: transform .1s ease, border-color .15s ease, background .15s ease;
  }
  .capture-tile i { font-size: 1.5rem; }
  .capture-tile:hover { border-color: #3a4452; color: #fff; }
  .capture-tile:active { transform: scale(.96); }
  .capture-tile.capture-ai i { color: #38bdf8; }
  .capture-tile.capture-ai:hover { border-color: #38bdf8; }
  .capture-tile:disabled { opacity: .5; cursor: not-allowed; }
</style>

<div id="qrScannerComponent" class="row row-cols-{% if plate_scan %}3{% else %}2{% endif %} g-2 mb-3">

  {% if plate_scan %}
  <!-- Escaneo de placa con cámara e IA (modal en _parking_plate_camera_modal.html) -->
  <div class="col">
    {% if plate_scan.exhausted %}
    <button type="button" id="plateCameraOpenBtn" class="capture-tile" disabled>
      <i class="bi bi-camera"></i>
      Paquete de IA agotado
    </button>
    {% else %}
    <button type="button" id="plateCameraOpenBtn" class="capture-tile capture-ai" onclick="PlateCamera.open()">
      <i class="bi bi-camera"></i>
      Escanear placa
    </button>
    {% endif %}
  </div>
  {% endif %}

  <!-- Dictado de placa por voz (modal en _parking_voice_plate_modal.html) -->
  <div class="col">
    <button type="button" id="voicePlateOpenBtn" class="capture-tile" onclick="VoicePlate.open()">
      <i class="bi bi-mic"></i>
      Dictar placa
    </button>
  </div>

  <!-- Escanear el QR del ticket (modal en _parking_qr_ticket_modal.html) -->
  <div class="col">
    <button type="button" id="qrTicketOpenBtn" class="capture-tile" onclick="QrScanner.open()">
      <i class="bi bi-qr-code-scan"></i>
      Escanear ticket
    </button>
  </div>

</div>
